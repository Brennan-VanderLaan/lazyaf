# =============================================================================
# LazyAF - secret scan (reusable)
# =============================================================================
#
# THIS IS A LEAK GATE, NOT A TEST GATE.
#
#   LazyAF gates LazyAF. Whether the code is CORRECT is decided by LazyAF's
#   own dogfood pipeline running on this repo; PLAN.md's standing decision
#   ("no external CI ever; self-host ASAP") is about that, and it still
#   holds. Nothing in .github/ decides whether the code is good.
#
#   What .github/ does is RELEASE ENGINEERING: it packages a revision the
#   dogfood pipeline already blessed, and it refuses to package one that
#   would publish a credential. That refusal is this file.
#
# WHY IT IS REUSABLE
#   Every workflow that publishes anything (release.yml, images.yml) calls
#   this and will not publish unless it passes, and the PR workflow calls it
#   too so a leak is caught at review time rather than at tag time. One
#   definition, three callers, no drift.
#
# WHAT IT ACTUALLY CHECKS
#   See .github/scripts/scan_repo_secrets.py - it is heavily commented. In
#   short: `.env` is still gitignored, no `.env` is tracked, and no tracked
#   file contains a live-format provider key. The test suite's deliberately
#   fake sentinels are allowlisted BY EXACT VALUE (never by file path), so a
#   real key sitting next to one still fails.
#
# SECRETS: none. This workflow requests no secrets and needs none. It reads
# the checkout and exits.
# =============================================================================

name: secret-scan

on:
  workflow_call:
    inputs:
      history_depth:
        description: >-
          Number of past commits whose patches to scan as well. '0' (the
          default) scans only the working tree, which is what actually gets
          published. A non-zero value forces an unshallow checkout.
        type: string
        default: '0'
  workflow_dispatch:
    inputs:
      history_depth:
        description: 'Commits of history to scan as well (0 = working tree only)'
        type: string
        default: '0'

# Least privilege. Read the code, nothing else. No packages, no contents:
# write, no id-token, no PR write.
permissions:
  contents: read

jobs:
  scan:
    name: scan for credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA, not a tag: a tag can be moved, a SHA cannot.
      # The comment records which release the SHA corresponds to so the pin
      # stays reviewable.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 only when a history scan was actually requested;
          # a shallow clone cannot be history-scanned, and a full clone is
          # wasted work for the default working-tree scan.
          fetch-depth: ${{ inputs.history_depth == '0' && 1 || 0 }}
          persist-credentials: false

      # No setup-python step on purpose: the scanner is stdlib-only, and the
      # runner image ships a python3. Fewer moving parts in the gate that
      # everything else depends on.
      - name: Scan tracked files for live-format credentials
        run: python3 .github/scripts/scan_repo_secrets.py --history "${HISTORY_DEPTH}"
        env:
          # Passed through the environment rather than interpolated into the
          # shell line, so a crafted input cannot become shell syntax.
          HISTORY_DEPTH: ${{ inputs.history_depth || '0' }}
