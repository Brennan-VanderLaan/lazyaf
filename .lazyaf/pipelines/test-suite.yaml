name: "Test Suite"
description: "Tiered dogfood CI: T1 unit/demos/integration, T2 Docker integration, T3 e2e quick - each tier gated by scripts/ci_gate.py (R4: skip baseline + executed-count floors), then verify-executor asserts the local execution path (and, from 12.3, the control-layer reporting path) ran every script step"
triggers:
  - type: push
    config:
      branches: ["main"]

# 12.3 dogfood ratchet: every step now runs on the lazyaf step images
# (lazyaf-test-runner:dev / lazyaf-base:dev), which bake LABEL
# lazyaf.control-layer=1 - so every step of this run executes in CONTROL MODE
# (in-container control runtime -> POST /api/steps/{id}/status|logs|heartbeat
# -> StepRun rows + the same step_update/step_log WS frames the UI renders).
# The dogfood run IS the standing round-trip acceptance for the control layer
# (R7); a step can set `control: false` in its config to use the old stdout
# path - verify-executor does so DELIBERATELY (gate independence: the gate
# must not run on the runtime it verifies), which also keeps the escape
# hatch exercised on every push.
#
# BUILD PREREQUISITE (no phantom :latest - the :dev tags are built locally,
# never pulled): run `python scripts/build_images.py` once, and again after
# editing images/** (it skips fresh builds via the lazyaf.content-hash label;
# `--check` lists missing/stale images without building; the scripts/test
# `images` lane wraps it). If the images are missing, this pipeline still
# materializes and triggers fine but the first step fails FAST and LOUD with
# "Image not found: lazyaf-test-runner:dev" - that message is the rebuild
# trigger by design; the backend never auto-builds mid-run.
#
# HOME=/workspace/home persists across steps on the run's named workspace
# volume; the images bake PIP_USER/PYTHONUSERBASE/NPM_CONFIG_PREFIX/PATH so
# per-step tool installs land there without any PATH exports in commands.
steps:
  # uv and node are BAKED into lazyaf-test-runner (the 12.2-INT install-uv
  # bootstrap step dissolved into the image at 12.3, per PLAN).
  - id: "sync-deps"
    name: "Sync Dependencies"
    type: script
    config:
      image: "lazyaf-test-runner:dev"
      command: |
        cd backend
        uv sync --all-extras
        uv sync --extra test
    continue_in_context: true
    on_success: next
    on_failure: stop
    # Cold-cache `uv sync` on a fresh workspace volume needs headroom; the
    # earlier 480 cut was unjustified.
    timeout: 720

  # Tier selections are SINGLE-SOURCED in scripts/run_tier.py (pytest args +
  # junitxml + the R4 ci_gate call); floors live in tdd/tier_floors.json and
  # allowed skip reasons in tdd/skip_baseline.json - see tdd/README.md.
  # A red pytest exits run_tier.py red before the gate runs and stays red.
  #
  # KNOWN EXCLUSION (stated per R4, not a silent cap): the @slow e2e tests
  # (control layer, real card execution, graph pipeline full-stack) run in NO
  # tier - they need the compose e2e stack, which a step container cannot
  # host yet. They stay runnable on the host via the scripts/test slow lane
  # and enter dogfood CI at Phase 12.4/12.5.
  - id: "tier1"
    name: "T1: Unit + Demos + Integration (no Docker)"
    type: script
    config:
      image: "lazyaf-test-runner:dev"
      command: |
        python3 scripts/run_tier.py T1
    continue_in_context: true
    on_success: next
    on_failure: stop
    timeout: 1800

  # Interim DooD, step-container edition: the Docker tiers get the host
  # socket via the `needs: [docker]` step-config sugar - ONE translation
  # site (pipeline_executor) instead of raw bind-mount specs repeated per
  # step, which is also the single seam Phase 12.4 rewires. Same tradeoff
  # as the retired runner-socket variant (host-root-equivalent for these
  # two steps only). If the socket is missing, these tests skip with
  # "Docker not available" - out of baseline, gate fails (R4).
  - id: "tier2"
    name: "T2: Docker-dependent integration"
    type: script
    config:
      image: "lazyaf-test-runner:dev"
      needs: ["docker"]
      command: |
        python3 scripts/run_tier.py T2
    continue_in_context: true
    on_success: next
    on_failure: stop
    timeout: 900

  - id: "tier3"
    name: "T3: E2E quick tier"
    type: script
    config:
      image: "lazyaf-test-runner:dev"
      needs: ["docker"]
      command: |
        python3 scripts/run_tier.py T3
    on_success: next
    on_failure: stop
    timeout: 1200

  # US-2 continuous coverage (12.5): a REAL agent step through the REAL
  # control runtime, executed by the mock executor - so the agent path (agent
  # config file, wrapper dispatch, usage manifest, POST /api/steps/{id}/usage)
  # is exercised on every push at zero API cost and with no egress to
  # api.anthropic.com. `agent: mock` resolves to lazyaf-agent-base:dev, which
  # is the agent runtime image itself (no fourth image to build).
  #
  # commit is FALSE: the dogfood run must never push to its own repo. That
  # also means this step needs no git credentials and leaves no branch behind.
  - id: "mock-agent"
    name: "US-2 mock agent step (zero cost)"
    type: agent
    config:
      agent: mock
      commit: false
      task: "Write .lazyaf-dogfood/agent-ran into the workspace"
      mock_config:
        response_mode: streaming
        delay_ms: 10
        file_operations:
          - action: create
            path: .lazyaf-dogfood/agent-ran
            content: "12.5 mock agent step\n"
        output_events:
          - {type: content, text: "Analyzing the workspace..."}
          - {type: complete, text: "Done."}
        exit_code: 0
    on_success: next
    on_failure: stop
    timeout: 300

  # Exit-gate ratchet (R1), 12.3 edition: every script step of THIS run must
  # have executor='local' AND (control-layer probe) show logs that arrived via
  # the POST /api/steps/* path with a StepExecution row per script step.
  # LAZYAF_PIPELINE_RUN_ID (and friends) are injected into every step
  # container by LocalExecutor; the backend is reachable by service DNS name
  # on the shared lazyaf-network. Runs on lazyaf-base:dev in STDOUT mode
  # (`control: false`): the gate that verifies the control runtime must not
  # DEPEND on the runtime it verifies - a broken runtime would otherwise
  # take the gate down with it. This also exercises the `control: false`
  # escape hatch on every push, so it can never rot silently.
  - id: "verify-executor"
    name: "Verify executor=local + control path for script steps"
    type: script
    config:
      image: "lazyaf-base:dev"
      control: false
      command: |
        python3 scripts/verify_executor.py
    on_success: next
    on_failure: stop
    timeout: 120
