services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      # Migrations live in the IMAGE (12.3: production boots self-sufficiently),
      # so dev must mount them too or a new revision is invisible until the
      # image is rebuilt - the container would sit at an older head and report
      # itself current. Mirrors the ./backend/app mount above.
      - ./backend/alembic:/app/alembic
      - lazyaf-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for LocalExecutor
      - lazyaf-workspaces:/workspaces  # Shared workspace volumes
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/lazyaf.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      # SHARED SECRETS (12.7). No default, here or in the source: the constants
      # that used to live in backend/app/config.py were public, and they mint
      # step JWTs and enrol runner agents. Compose cannot generate a value for
      # you, so it refuses to start and tells you the one command that can.
      # `bootstrap_secrets.py` is idempotent - it never touches a value you set.
      - 'LAZYAF_STEP_AUTH_SECRET=${LAZYAF_STEP_AUTH_SECRET:?not set. Run: python scripts/bootstrap_secrets.py}'
      - 'LAZYAF_RUNNER_AUTH_SECRET=${LAZYAF_RUNNER_AUTH_SECRET:?not set. Run: python scripts/bootstrap_secrets.py}'
    networks:
      - lazyaf-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - lazyaf-network
    restart: unless-stopped

  # 12.6 REMOTE LANE, loopback edition (R7).
  #
  # Remote hardware is manual (owner decision), so the TESTED remote path is a
  # real `lazyaf_runner` agent process on THIS host speaking the real
  # WebSocket protocol to the real backend. Nothing here is a simulation: same
  # protocol, same shared-secret handshake, same registry, same assignment
  # compare-and-swap, same control-mode step container. The only thing it does
  # not exercise is physical network latency.
  #
  # It carries a `remote-lane` capability label that NOTHING ELSE carries, and
  # the dogfood pipeline pins two steps to it (`remote-probe` and
  # `mock-agent`). If this service is down, or the protocol / registry / CAS /
  # workspace provisioning break, those steps FAIL THE PUSH - remote execution
  # is covered continuously rather than once at an exit gate.
  #
  # DooD, deliberately and for the same reason the T2 tier step already does
  # it: the agent's docker orchestrator spawns step containers on the host
  # daemon. Host-root-equivalent for this service. A real remote host would run
  # this same image against ITS OWN daemon, which is the whole point.
  runner-agent:
    build: ./runner-agent
    environment:
      - LAZYAF_BACKEND_URL=http://backend:8000
      # STABLE across restarts. A fresh uuid4 per process orphans a registry
      # row on every restart and leaves the fleet looking twice its real size.
      - LAZYAF_RUNNER_ID=dogfood-loopback
      - LAZYAF_RUNNER_NAME=dogfood loopback agent
      - LAZYAF_RUNNER_TYPE=generic
      # `arch` is NOT set here: the agent reports platform.machine() raw and
      # the backend normalizes it, so there is exactly one implementation of
      # that mapping (runner_protocol.normalize_arch).
      - LAZYAF_RUNNER_LABELS=has=docker,has=remote-lane,lane=dogfood
      - LAZYAF_ORCHESTRATOR=docker
      # Step containers this agent spawns must reach the backend and the git
      # server by service DNS, so they join the shared network too.
      - LAZYAF_STEP_NETWORK=lazyaf-network
      - LAZYAF_STEP_BACKEND_URL=http://backend:8000
      # REQUIRED, and it is not a formality: the agent refuses plaintext
      # ws:// to a NON-LOOPBACK host by default (section 4.3) because
      # execute_step.config carries the step JWT and secret_environment.
      # `backend` is a compose service name, not loopback, so without this
      # the agent exits before `register` and GET /api/runners is empty -
      # which fails verify_executor assertion 9 and the whole dogfood
      # remote lane. Accepting it here is bounded: lazyaf-network is a
      # private bridge on ONE host and the frame never leaves the daemon.
      # A REAL remote host must use wss:// instead of setting this.
      - LAZYAF_RUNNER_ALLOW_INSECURE=1
      # The SAME secret the backend checks at the /ws/runner upgrade. Until
      # 12.7 both sides silently defaulted to the same public constant, so this
      # line did not need to exist and the handshake "worked" for everyone on
      # earth. It is explicit now, and the agent refuses to dial without it.
      - 'LAZYAF_RUNNER_TOKEN=${LAZYAF_RUNNER_AUTH_SECRET:?not set. Run: python scripts/bootstrap_secrets.py}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
    networks:
      - lazyaf-network
    restart: unless-stopped

  # M14 (wave8 s8.1): CI MUST NOT NEED A GPU.
  #
  # A stdlib OpenAI-compatible server that speaks the same wire format ollama
  # and vLLM do, deterministically. The backend probes it, step containers run
  # the agent harness against it, and the dogfood pipeline drives two agent
  # steps through it on every push at zero cost and with no GPU anywhere.
  #
  # It serves ALL NINE scenarios at once, one per URL prefix, so a single
  # process backs every endpoint anyone needs:
  #   http://mock-endpoint:8099/happy_tools/v1   <- tool-calling model
  #   http://mock-endpoint:8099/happy_text/v1    <- model that CANNOT tool-call
  #   http://mock-endpoint:8099/no_usage/v1      <- model that reports no usage
  #   ... plus never_finishes, malformed, malformed_forever, lying_tools,
  #       slow and flaky_5xx (see tdd/shared/mock_openai/scenarios.py).
  #
  # 8099 is published to the host as well, so `curl localhost:8099/health` and
  # the hands-on guide in upcoming/m14-testing.md work without exec'ing in.
  #
  # No build: it is stdlib-only Python, so the stock python image plus a
  # read-only mount of ./tdd is the whole service. Nothing here is a lazyaf
  # image, so the no-phantom-:latest rule about lazyaf-*:dev tags does not
  # apply - this is the same public base the backend Dockerfile already uses.
  mock-endpoint:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-m", "tdd.shared.mock_openai", "--host", "0.0.0.0", "--port", "8099"]
    environment:
      # The scenario served at the BARE /v1 prefix (every scenario is also
      # reachable at /<scenario>/v1 regardless of this).
      - LAZYAF_MOCK_SCENARIO=happy_tools
    volumes:
      - ./tdd:/app/tdd:ro
    ports:
      - "8099:8099"
    networks:
      - lazyaf-network
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/health',timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  # E2E Testing Services
  backend-e2e:
    build:
      context: ./backend
      args:
        INCLUDE_DEV: "true"
    ports:
      - "8765:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////tmp/e2e_test.db
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      # This service is named backend-e2e on the shared network; the default
      # template resolves "backend", which is a DIFFERENT (possibly absent)
      # service. Step/population containers must clone from THIS backend.
      - CONTAINER_GIT_URL_TEMPLATE=http://backend-e2e:8000/git/{repo_id}.git
      # Same service-name reasoning: step containers must call back into THIS
      # backend, not the (possibly absent) dev "backend" service.
      - CONTAINER_BACKEND_URL=http://backend-e2e:8000
      # Same requirement as the dev backend (12.7). The e2e lane shares the
      # host's .env, so one bootstrap run covers both stacks - and the pair
      # below must match, or runner-agent-e2e never enrols and the runner-panel
      # browser spec renders an empty fleet.
      - 'LAZYAF_STEP_AUTH_SECRET=${LAZYAF_STEP_AUTH_SECRET:?not set. Run: python scripts/bootstrap_secrets.py}'
      - 'LAZYAF_RUNNER_AUTH_SECRET=${LAZYAF_RUNNER_AUTH_SECRET:?not set. Run: python scripts/bootstrap_secrets.py}'
    volumes:
      - ./tdd:/tdd  # Mount test directory for running e2e tests
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket - e2e lane exercises LocalExecutor
      - lazyaf-workspaces:/workspaces  # Shared workspace volumes
    networks:
      - lazyaf-network
    profiles:
      - e2e
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  # The e2e twin of the dev `runner-agent`: same image, same labels, pointed at
  # backend-e2e. frontend/e2e/runners.spec.ts needs an enrolled agent to prove
  # the runner panel's snapshot-then-delta model against a live registry, and
  # the loopback integration suite dispatches pinned steps at it.
  runner-agent-e2e:
    build: ./runner-agent
    environment:
      - LAZYAF_BACKEND_URL=http://backend-e2e:8000
      - LAZYAF_RUNNER_ID=e2e-loopback
      - LAZYAF_RUNNER_NAME=e2e loopback agent
      - LAZYAF_RUNNER_TYPE=generic
      - LAZYAF_RUNNER_LABELS=has=docker,has=remote-lane,lane=e2e
      - LAZYAF_ORCHESTRATOR=docker
      - LAZYAF_STEP_NETWORK=lazyaf-network
      # Same service-name reasoning as backend-e2e's own overrides: step
      # containers must call back into THIS backend, not the (possibly absent)
      # dev "backend" service.
      - LAZYAF_STEP_BACKEND_URL=http://backend-e2e:8000
      # Same reason as the dev `runner-agent` above: `backend-e2e` is a
      # compose service name, so the plaintext-ws guard would otherwise
      # stop this agent before it registers and runners.spec.ts would have
      # no fleet to render.
      - LAZYAF_RUNNER_ALLOW_INSECURE=1
      # Must equal backend-e2e's LAZYAF_RUNNER_AUTH_SECRET above.
      - 'LAZYAF_RUNNER_TOKEN=${LAZYAF_RUNNER_AUTH_SECRET:?not set. Run: python scripts/bootstrap_secrets.py}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend-e2e:
        condition: service_healthy
    networks:
      - lazyaf-network
    profiles:
      - e2e

networks:
  lazyaf-network:
    # Stable, project-independent name: step/helper containers spawned by the
    # backend (LocalExecutor, workspace population) attach to it by this name.
    name: lazyaf-network

volumes:
  lazyaf-data:
  lazyaf-workspaces:  # Shared workspace volumes for LocalExecutor
