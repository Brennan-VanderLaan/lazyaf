name: "Test Suite"
description: "Tiered dogfood CI: a stdlib secret scan, then T1 unit/demos/integration, T2 Docker integration, T3 e2e quick - each tier gated by scripts/ci_gate.py (R4: skip baseline + executed-count floors), then verify-executor asserts the local execution path (and, from 12.3, the control-layer reporting path) ran every script step"
triggers:
  - type: push
    config:
      branches: ["main"]

# 12.3 dogfood ratchet: every step now runs on the lazyaf step images
# (lazyaf-test-runner:dev / lazyaf-base:dev), which bake LABEL
# lazyaf.control-layer=1 - so every step of this run executes in CONTROL MODE
# (in-container control runtime -> POST /api/steps/{id}/status|logs|heartbeat
# -> StepRun rows + the same step_update/step_log WS frames the UI renders).
# The dogfood run IS the standing round-trip acceptance for the control layer
# (R7); a step can set `control: false` in its config to use the old stdout
# path - verify-executor does so DELIBERATELY (gate independence: the gate
# must not run on the runtime it verifies), which also keeps the escape
# hatch exercised on every push.
#
# BUILD PREREQUISITE (no phantom :latest - the :dev tags are built locally,
# never pulled): run `python scripts/build_images.py` once, and again after
# editing images/** (it skips fresh builds via the lazyaf.content-hash label;
# `--check` lists missing/stale images without building; the scripts/test
# `images` lane wraps it). If the images are missing, this pipeline still
# materializes and triggers fine but the first step fails FAST and LOUD with
# "Image not found: lazyaf-test-runner:dev" - that message is the rebuild
# trigger by design; the backend never auto-builds mid-run.
#
# HOME=/workspace/home persists across steps on the run's named workspace
# volume; the images bake PIP_USER/PYTHONUSERBASE/NPM_CONFIG_PREFIX/PATH so
# per-step tool installs land there without any PATH exports in commands.
steps:
  # LEAK GATE, FIRST AND CHEAPEST. `.github/scripts/scan_repo_secrets.py`
  # existed and ran in the RELEASE workflow, but the dogfood pipeline never
  # called it - so a credential committed and pushed to LazyAF passed LazyAF.
  # A push gate that does not run the project's own leak gate is exactly the
  # dark behaviour R1 exists to remove, and the owner's standing constraint is
  # "do not leak AI api keys".
  #
  # It is the FIRST step because it is the cheapest one that can refuse a
  # push: stdlib-only, no dependency sync, no Docker socket, and a full pass
  # over every tracked file finishes in about a second (660 files at the time
  # this landed). Every second it saves is a second a real key is not sitting
  # in a public repo.
  #
  # It runs on lazyaf-base:dev in CONTROL MODE like every other step, so it is
  # covered by verify-executor's assertions the same way: executor == 'local'
  # (no `requires:`), non-marker logs delivered over POST /api/steps/{id}/logs
  # (the scanner always prints its "scanned N of M tracked files" line), and a
  # StepUsage row. lazyaf-base bakes git and python3.12, which is everything
  # the scanner needs: `git ls-files`, `git check-ignore` and the stdlib.
  #
  # `on_failure: stop` is the point. Exit 1 = a finding, and a `stop` completes
  # the run with THIS step's verdict - so a finding FAILS THE RUN rather than
  # warning into a log nobody reads. Exit 2 ("the scanner could not run", e.g.
  # not a git checkout) fails it too, which is the honest reading: a leak gate
  # that could not look is not a leak gate that found nothing.
  #
  # NOT --history: the working tree is what gets published, a history scan
  # needs an unshallow clone, and this must stay cheap enough to sit in front
  # of every push. The secret-scan workflow exposes --history as an on-demand
  # audit.
  - id: "secret-scan"
    name: "Secret scan (leak gate)"
    type: script
    config:
      image: "lazyaf-base:dev"
      command: |
        python3 .github/scripts/scan_repo_secrets.py
    on_success: next
    on_failure: stop
    timeout: 120

  # uv and node are BAKED into lazyaf-test-runner (the 12.2-INT install-uv
  # bootstrap step dissolved into the image at 12.3, per PLAN).
  - id: "sync-deps"
    name: "Sync Dependencies"
    type: script
    config:
      image: "lazyaf-test-runner:dev"
      command: |
        cd backend
        uv sync --all-extras
        uv sync --extra test
    continue_in_context: true
    on_success: next
    on_failure: stop
    # Cold-cache `uv sync` on a fresh workspace volume needs headroom; the
    # earlier 480 cut was unjustified.
    timeout: 720

  # Tier selections are SINGLE-SOURCED in scripts/run_tier.py (pytest args +
  # junitxml + the R4 ci_gate call); floors live in tdd/tier_floors.json and
  # allowed skip reasons in tdd/skip_baseline.json - see tdd/README.md.
  # A red pytest exits run_tier.py red before the gate runs and stays red.
  #
  # KNOWN EXCLUSION (stated per R4, not a silent cap): the @slow e2e tests
  # (control layer, real card execution, graph pipeline full-stack) run in NO
  # tier - they need the compose e2e stack, which a step container cannot
  # host yet. They stay runnable on the host via the scripts/test slow lane
  # and enter dogfood CI at Phase 12.4/12.5.
  - id: "tier1"
    name: "T1: Unit + Demos + Integration (no Docker)"
    type: script
    config:
      image: "lazyaf-test-runner:dev"
      command: |
        python3 scripts/run_tier.py T1
    continue_in_context: true
    on_success: next
    on_failure: stop
    timeout: 1800

  # Interim DooD, step-container edition: the Docker tiers get the host
  # socket via the `needs: [docker]` step-config sugar - ONE translation
  # site (pipeline_executor) instead of raw bind-mount specs repeated per
  # step, which is also the single seam Phase 12.4 rewires. Same tradeoff
  # as the retired runner-socket variant (host-root-equivalent for these
  # two steps only). If the socket is missing, these tests skip with
  # "Docker not available" - out of baseline, gate fails (R4).
  - id: "tier2"
    name: "T2: Docker-dependent integration"
    type: script
    config:
      image: "lazyaf-test-runner:dev"
      needs: ["docker"]
      command: |
        python3 scripts/run_tier.py T2
    continue_in_context: true
    on_success: next
    on_failure: stop
    timeout: 900

  - id: "tier3"
    name: "T3: E2E quick tier"
    type: script
    config:
      image: "lazyaf-test-runner:dev"
      needs: ["docker"]
      command: |
        python3 scripts/run_tier.py T3
    on_success: next
    on_failure: stop
    timeout: 1200

  # US-2 continuous coverage (12.5): a REAL agent step through the REAL
  # control runtime, executed by the mock executor - so the agent path (agent
  # config file, wrapper dispatch, usage manifest, POST /api/steps/{id}/usage)
  # is exercised on every push at zero API cost and with no egress to
  # api.anthropic.com. `agent: mock` resolves to lazyaf-agent-base:dev, which
  # is the agent runtime image itself (no fourth image to build).
  #
  # commit is FALSE: the dogfood run must never push to its own repo. That
  # also means this step needs no git credentials and leaves no branch behind.
  #
  # 12.6 MOVES THIS STEP TO THE REMOTE LANE (`requires:` below). 12.5 left a
  # stated precondition - "US-2 e2e green on the remote path, not just local"
  # - and this satisfies it on every push at zero cost: the agent config file,
  # the wrapper, the usage manifest and its POST all have to survive the trip
  # to another host. tdd/e2e/test_us2_card_loop.py keeps US-2 covered on the
  # LOCAL path in T3, so both paths are covered continuously rather than one
  # replacing the other.
  #
  # It also proves the thing a script step cannot: that 12.5's usage channel
  # still writes a StepUsage row with real token counts when the step ran
  # somewhere else entirely (verify_executor assertion 12).
  - id: "mock-agent"
    name: "US-2 mock agent step (zero cost, remote lane)"
    type: agent
    config:
      agent: mock
      commit: false
      requires:
        has: ["remote-lane"]
      task: "Write .lazyaf-dogfood/agent-ran into the workspace"
      mock_config:
        response_mode: streaming
        delay_ms: 10
        file_operations:
          - action: create
            path: .lazyaf-dogfood/agent-ran
            content: "12.5 mock agent step\n"
        output_events:
          - {type: content, text: "Analyzing the workspace..."}
          - {type: complete, text: "Done."}
        exit_code: 0
    on_success: next
    on_failure: stop
    timeout: 300

  # 12.6 REMOTE LANE (R7): this step is pinned to the loopback runner-agent by
  # a capability label only that agent carries. If the agent is down, or the
  # WS protocol, the registry, the assignment CAS or the agent's workspace
  # provisioning break, this step FAILS THE PUSH. Remote execution is covered
  # continuously, not once at an exit gate.
  #
  # `ls /workspace/repo/PLAN.md` is not decoration. It is the ONE piece of
  # remote execution with no local analogue: a remote agent cannot see the
  # backend's `lazyaf-workspaces` volume, so it has to create its own named
  # volume on its own daemon and clone the repo into it from the backend's git
  # server. If that clone silently did nothing, `echo` would still succeed and
  # the step would still pass - this line is what makes the difference visible.
  #
  # The `$(hostname)` echo names the container the agent spawned, so a
  # failure diff shows WHERE it ran, not just that it ran.
  - id: "remote-probe"
    name: "Remote lane: script step via the loopback runner agent"
    type: script
    config:
      image: "lazyaf-base:dev"
      requires:
        has: ["remote-lane"]
      command: |
        echo "[remote-probe] executed on $(hostname)"
        ls /workspace/repo/PLAN.md
    on_success: next
    on_failure: stop
    timeout: 300

  # 14.x SELF-HOSTED LANE (R7). CI MUST NOT NEED A GPU, so these three steps
  # run against the `mock-endpoint` compose service: a stdlib
  # OpenAI-compatible server (tdd/shared/mock_openai) that speaks the same
  # wire format ollama and vLLM do, deterministically, at zero cost.
  #
  # This step registers the two endpoints the harness steps name. It uses the
  # ordinary public API rather than /api/test/seed, because the DEV stack this
  # pipeline runs against deliberately has LAZYAF_TEST_MODE off - and because
  # the same two POSTs are what a human does by hand (see
  # upcoming/m14-testing.md). It is idempotent: an existing row is PATCHed
  # back into shape and re-probed.
  #
  # If the mock service is down, or the endpoint registry / capability probe
  # broke, this step FAILS THE PUSH here rather than 300 seconds later inside
  # an agent step whose only symptom would be "no endpoint named dogfood-mock".
  - id: "seed-endpoints"
    name: "14.1 register + probe the mock model endpoints"
    type: script
    config:
      image: "lazyaf-base:dev"
      command: |
        python3 scripts/seed_dogfood_endpoints.py
    on_success: next
    on_failure: stop
    timeout: 180

  # 14.2 harness coverage (R7): the REAL harness through the REAL control
  # runtime against a REAL OpenAI-compatible server. If the loop, the tool
  # sandbox, the token accumulator, the gpu-node pricing path or the endpoint
  # registry break, this step FAILS THE PUSH.
  #
  # The mock's happy_tools script is SIX turns (list_files, run_shell mkdir,
  # write_file, apply_patch, read_file, finish), and every turn reports
  # growing usage - which is what makes verify_executor assertion 13's
  # "the accumulator SUMMED across turns" a checkable claim. max_iterations
  # must therefore stay strictly above 6.
  #
  # commit is FALSE for the same reason the mock-agent step's is: the dogfood
  # run must never push to its own repo.
  - id: "harness-probe"
    name: "14.2 agent harness (tools mode, mock endpoint)"
    type: agent
    config:
      agent: openai-harness
      endpoint: "dogfood-mock"
      commit: false
      task: "Create .lazyaf-dogfood/harness-ran naming the endpoint you used"
      harness:
        max_iterations: 8
        time_budget_seconds: 120
    on_success: next
    on_failure: stop
    timeout: 300

  # The fallback protocol is the part most likely to rot, because nothing
  # exercises it once a tool-capable model is plugged in. It runs every push.
  # `mode: text` is PINNED rather than inferred: forcing the no-tools loop is
  # also how M13 makes loop shape an independent variable, so the pin is the
  # feature, not a workaround.
  - id: "harness-probe-notools"
    name: "14.2 agent harness (no-tools fallback, mock endpoint)"
    type: agent
    config:
      agent: openai-harness
      endpoint: "dogfood-mock-notools"
      commit: false
      task: "Create .lazyaf-dogfood/harness-fallback-ran"
      harness:
        mode: text
        max_iterations: 8
        time_budget_seconds: 120
    on_success: next
    on_failure: stop
    timeout: 300

  # Exit-gate ratchet (R1), 12.6 edition: every step of THIS run must have run
  # on the LANE ITS DEFINITION ASKS FOR - `requires:` means remote, everything
  # else means local - AND (control-layer probe) show logs that arrived via the
  # POST /api/steps/* path with a StepExecution row per script step. Checking a
  # DERIVED expectation rather than the constant 'local' is what makes a global
  # accidental flip to remote as loud as a pinned step falling back to local.
  # The gate also requires a live, socket-backed runner in GET /api/runners and
  # a real runner_id on every remote step: "executor said remote" and "a
  # machine did the work" are different claims.
  # LAZYAF_PIPELINE_RUN_ID (and friends) are injected into every step
  # container by LocalExecutor; the backend is reachable by service DNS name
  # on the shared lazyaf-network. Runs on lazyaf-base:dev in STDOUT mode
  # (`control: false`): the gate that verifies the control runtime must not
  # DEPEND on the runtime it verifies - a broken runtime would otherwise
  # take the gate down with it. This also exercises the `control: false`
  # escape hatch on every push, so it can never rot silently.
  - id: "verify-executor"
    name: "Verify executor=local + control path for script steps"
    type: script
    config:
      image: "lazyaf-base:dev"
      control: false
      command: |
        python3 scripts/verify_executor.py
    on_success: next
    on_failure: stop
    timeout: 120
