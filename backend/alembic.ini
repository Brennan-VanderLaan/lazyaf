# Alembic configuration for the LazyAF backend.
#
# sqlalchemy.url is intentionally absent: env.py derives the URL from app
# settings (DATABASE_URL), and programmatic callers (startup, tests) pass a
# live connection via config.attributes["connection"].

[alembic]
# path to migration scripts, relative to this ini file
script_location = %(here)s/alembic

# use os.pathsep when splitting path lists below
path_separator = os

prepend_sys_path = .

# Logging configuration, consumed by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
