# Keep the pinned action SHAs from rotting.
#
# The release workflows pin every action to a commit SHA rather than a tag,
# because a tag can be moved by whoever owns the action and a SHA cannot.
# That is the right trade, but it has a cost: a SHA pin never picks up a
# security fix on its own, so without something watching them the pins
# quietly become the stalest thing in the repository.
#
# This is that something. It is scoped to `github-actions` and NOTHING ELSE
# on purpose:
#
#   * Python and npm dependencies are LazyAF's own supply chain, and changing
#     them changes the product. Those belong to the dogfood pipeline, which is
#     what actually tests this project - not to a bot opening PRs on GitHub.
#     (See .github/WORKFLOWS.md: GitHub packages LazyAF, it does not gate it.)
#   * Docker base images are pulled with `--pull` at build time and, for the
#     step images, tracked by build_images.py's content-hash chain. A
#     dependabot PR editing a Dockerfile would fight that machinery.
#
# So: one ecosystem, one directory, monthly. Each PR bumps a SHA and updates
# the `# vX.Y.Z` comment beside it, which is exactly the maintenance burden
# that pinning creates and nothing more. Review the diff of the action itself
# before merging - a SHA bump is a supply-chain change, not a chore.
#
# ONE EXCEPTION, and why it does not contradict the paragraph above: the Go
# modules in the root go.mod (the `lazyaf` binary's dependencies -
# upcoming/go-cli.md §9.3). They ARE the product's supply chain, exactly like
# pip's. The difference is mechanical, not philosophical: every Go module is
# hash-pinned in go.sum, `go mod verify` runs against those hashes in
# pr-build.yml and release.yml BEFORE a bump can merge, and a merged bump is
# tested AFTER merge by the dogfood pipeline's TG tier on the push to main -
# which is precisely how a merged actions bump is treated today. pip has no
# go.sum and no `go mod verify`, so pip stays out. A gomod PR is a `build`
# commit (a patch bump under CONTRIBUTING.md's table); gotestsum rides the
# same PR because go.mod's `tool` directive pins it there.

version: 2

updates:
  - package-ecosystem: "github-actions"
    # `/` means .github/workflows/ - the only place actions are referenced.
    directory: "/"
    schedule:
      interval: "monthly"
    # Batch them: five actions arriving as five separate PRs is how people
    # learn to rubber-stamp SHA bumps without reading them.
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 3

  - package-ecosystem: "gomod"
    # The root go.mod - the ONLY Go module in the tree (§2.1).
    directory: "/"
    schedule:
      interval: "monthly"
    # One PR for all of them, for the same reason as the actions group.
    groups:
      gomod:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "cli"
    commit-message:
      prefix: "build(cli)"
    open-pull-requests-limit: 3
