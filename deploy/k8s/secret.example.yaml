# LazyAF shared secrets - SHAPE ONLY. Deliberately holds no values.
#
# DO NOT fill this in and commit it. A Secret manifest in git is a plaintext
# secret in git; base64 is encoding, not encryption, and `stringData` is not
# even that.
#
# Create it from the command line instead, so the value never touches a file:
#
#   kubectl create secret generic lazyaf-secrets \
#     --namespace lazyaf \
#     --from-literal=step-auth-secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=runner-auth-secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
#
# If your workflow genuinely needs the manifest in git, encrypt it - SOPS,
# sealed-secrets, or External Secrets pulling from a real secret store.
#
# WHAT THESE ARE
#   step-auth-secret     signs the short-lived JWT a step container presents to
#                        /api/steps/* to report logs, status and results.
#   runner-auth-secret   the shared enrollment secret a runner agent presents at
#                        the /ws/runner upgrade, and the signing key for
#                        per-runner tokens.
#
# Both are REQUIRED. LazyAF ships no default for either: the constants it used
# to fall back to were in a public repository, which made them credentials
# anyone could mint. The backend refuses to start without real values and treats
# the old constants as unset.
#
# Two INDEPENDENT random values. Do not reuse one for both, and do not reuse
# either across installations.
---
apiVersion: v1
kind: Secret
metadata:
  name: lazyaf-secrets
  namespace: lazyaf
type: Opaque
stringData:
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
  step-auth-secret: ""      # <-- REPLACE, or better: use kubectl create secret
  runner-auth-secret: ""    # <-- REPLACE, or better: use kubectl create secret
