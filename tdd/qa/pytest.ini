; Standalone pytest config for the QA lane.
;
; Rooting the QA tests here keeps them clear of tdd/conftest.py, which imports
; the backend application at collection time. These tests only speak HTTP to a
; running stack, so they must not need backend imports or a local database.
;
; Run with:
;     python -m pytest -c tdd/qa/pytest.ini tdd/qa
;     LAZYAF_QA_BASE_URL=http://localhost:8790 python -m pytest -c tdd/qa/pytest.ini tdd/qa
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
markers =
    qa: QA lane test (shared marker for the tdd/qa directory)
    qa4: QA-4 lane - resource abuse and pipeline-graph pathology
    containers: needs the stack to be able to actually start step containers
    heavy: deliberately expensive; may take minutes or stress the docker daemon
filterwarnings =
    ignore::DeprecationWarning
